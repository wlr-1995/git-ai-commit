appId: com.xingqiong.git-ai-commit
productName: AI 提交
executableName: git-ai-commit
copyright: Copyright (c) 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# 便携交付：把右键菜单装/卸脚本放到 exe 同级，拷到别的电脑后双击 cmd 即可
extraFiles:
  - from: install
    to: .
    filter:
      - "*.ps1"
      - "*.cmd"
win:
  target:
    - target: dir
      arch:
        - x64
  icon: build/icon.ico
